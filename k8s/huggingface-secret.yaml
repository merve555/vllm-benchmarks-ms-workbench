apiVersion: v1
kind: Secret
metadata:
  name: huggingface-token
  namespace: default
type: Opaque
data:
  token: eW91ci1oZi10b2tlbg==  # base64 encoded "your-hf-token"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: benchmark-script
  namespace: default
data:
  auto_tune_benchmark.sh: |
    #!/bin/bash
    set -e
    
    echo "Starting vLLM benchmark on $SYSTEM..."
    
    # Install required packages
    pip install --upgrade pip
    pip install vllm google-cloud-storage
    
    # Create results directory
    mkdir -p /tmp/results
    
    # Run benchmark
    python -c "
    from vllm import LLM, SamplingParams
    import time
    import json
    import os
    from google.cloud import storage
    
    # Initialize model
    model = LLM(
        model='$MODEL',
        tensor_parallel_size=$TENSOR_PARALLEL_SIZE,
        max_model_len=$MAX_MODEL_LEN,
        trust_remote_code=True
    )
    
    # Benchmark parameters
    input_length = $INPUT_LEN
    output_length = $OUTPUT_LEN
    
    # Generate test input
    test_input = 'A' * input_length
    
    # Run benchmark
    start_time = time.time()
    
    sampling_params = SamplingParams(
        temperature=0.7,
        top_p=0.95,
        max_tokens=output_length
    )
    
    outputs = model.generate([test_input], sampling_params)
    
    end_time = time.time()
    latency = end_time - start_time
    
    # Calculate metrics
    tokens_per_second = output_length / latency
    
    # Prepare results
    results = {
        'system': '$SYSTEM',
        'model': '$MODEL',
        'input_length': input_length,
        'output_length': output_length,
        'latency_seconds': latency,
        'tokens_per_second': tokens_per_second,
        'timestamp': time.time()
    }
    
    # Save results locally
    with open('/tmp/results/benchmark_results.json', 'w') as f:
        json.dump(results, f, indent=2)
    
    print(f'Benchmark completed: {tokens_per_second:.2f} tokens/sec')
    "
    
    # Upload results to GCS
    if [ -n "$GCS_BUCKET" ]; then
        echo "Uploading results to GCS bucket: $GCS_BUCKET"
        gsutil cp /tmp/results/benchmark_results.json gs://$GCS_BUCKET/$RESULTS_PREFIX/$(date +%Y%m%d_%H%M%S)_${SYSTEM}_results.json
    fi
    
    echo "Benchmark completed successfully!"

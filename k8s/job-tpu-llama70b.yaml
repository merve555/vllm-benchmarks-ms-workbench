apiVersion: batch/v1
kind: Job
metadata:
  name: vllm-tpu-benchmark-llama70b-nightly
  namespace: default
spec:
  template:
    spec:
      serviceAccountName: default
      nodeSelector:
        cloud.google.com/gke-nodepool: tpu-v6e-pool
        cloud.google.com/gke-tpu-accelerator: tpu-v6e-slice
        cloud.google.com/gke-tpu-topology: 2x4
      tolerations:
        - key: cloud.google.com/gke-tpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: vllm-benchmark
          image: vllm/vllm-tpu:nightly
          imagePullPolicy: Always
          env:
            - name: MODEL
              value: "meta-llama/Llama-3.3-70B-Instruct"
            - name: SYSTEM
              value: "TPU"
            - name: INPUT_LEN
              value: "1000"
            - name: OUTPUT_LEN
              value: "1000"
            - name: MAX_MODEL_LEN
              value: "2000"
            - name: NUM_SEQS_LIST
              value: "128,256,512"
            - name: NUM_BATCHED_TOKENS_LIST
              value: "1024,2048,4096"
            - name: ENABLE_PREFIX_CACHING
              value: "false"
            - name: TP
              value: "8"
            - name: GCS_BUCKET
              value: "vllm-bm-results"
            - name: RESULTS_PREFIX
              value: "vllm-benchmarks"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: token
            - name: BASE
              value: "/models"
            - name: VLLM_LOGGING_LEVEL
              value: "INFO"
          command: ["/bin/bash"]
          args:
            - -c
            - |
              # Copy and run benchmark script
              cp /config/auto_tune_benchmark.sh /tmp/auto_tune_benchmark.sh
              chmod +x /tmp/auto_tune_benchmark.sh
              cd /tmp
              ./auto_tune_benchmark.sh
          resources:
            requests:
              google.com/tpu: 8
              ephemeral-storage: 40Gi
            limits:
              google.com/tpu: 8
              ephemeral-storage: 45Gi
          volumeMounts:
            - name: benchmark-script
              mountPath: /config
            - name: model-storage
              mountPath: /models
      volumes:
        - name: benchmark-script
          configMap:
            name: benchmark-script
        - name: model-storage
          emptyDir:
            sizeLimit: 42Gi
      restartPolicy: Never
  backoffLimit: 0
